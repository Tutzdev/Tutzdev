<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Tutz.dev</title>
  <desc id="desc">Back-end developer: Java, Spring Boot, Python, Flask e Django</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B130B"/>
      <stop offset="1" stop-color="#030503"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.17" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#8CFF1F" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#8CFF1F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4FFB0"/>
      <stop offset="0.45" stop-color="#A6FF1A"/>
      <stop offset="1" stop-color="#4FC400"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B655B"/>
      <stop offset="0.5" stop-color="#262D26"/>
      <stop offset="1" stop-color="#424B42"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A6FF1A" stop-opacity="0"/>
      <stop offset="1" stop-color="#A6FF1A" stop-opacity="0.07"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8CFF1F" stroke-opacity="0.06"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.4" fill="#000" fill-opacity="0.32"/>
    </pattern>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
    <clipPath id="face"><circle cx="200" cy="160" r="70"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Courier New', Consolas, 'Liberation Mono', monospace; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    .spin { animation: spin 30s linear infinite; transform-origin: 200px 160px; }
    .spin-rev { animation: spin 18s linear infinite reverse; transform-origin: 200px 160px; }
    .sweep { animation: sweep 7s linear infinite; }
    .lvl { animation: lvl 1.8s ease-in-out infinite; }
    .l2 { animation-delay: .15s; } .l3 { animation-delay: .3s; } .l4 { animation-delay: .45s; }
    .l5 { animation-delay: .6s; } .l6 { animation-delay: .75s; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .78; } 50% { opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes sweep { from { transform: translateY(-60px); } to { transform: translateY(340px); } }
    @keyframes lvl { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <rect class="sweep" width="1200" height="60" fill="url(#sweepGrad)"/>

    <!-- dial -->
    <circle class="spin" cx="200" cy="160" r="128" fill="none" stroke="#A6FF1A" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="2 9"/>
    <circle cx="200" cy="160" r="110" fill="#0D140D" stroke="url(#metal)" stroke-width="14"/>
    <circle class="spin-rev" cx="200" cy="160" r="92" fill="none" stroke="#A6FF1A" stroke-opacity="0.7" stroke-width="5" stroke-dasharray="58 14.25"/>
    <circle cx="200" cy="160" r="74" fill="#040704" stroke="#1E2A1E" stroke-width="4"/>
    <g clip-path="url(#face)" class="pulse" filter="url(#blur)">
      <path d="M112 78 H288 L214 160 L288 242 H112 L186 160 Z" fill="url(#neon)"/>
    </g>
    <circle cx="200" cy="160" r="74" fill="none" stroke="#A6FF1A" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="193" y="40" width="14" height="12" rx="2" fill="#5B655B"/>
    <rect x="193" y="268" width="14" height="12" rx="2" fill="#5B655B"/>

    <!-- identity -->
    <text x="372" y="96" font-size="18" fill="#6F9A57">&gt; whoami</text>
    <text x="368" y="176" font-size="86" font-weight="700" letter-spacing="6" fill="url(#neon)" filter="url(#blur)">TUTZ.DEV</text>
    <text x="372" y="218" font-size="25" font-weight="700" letter-spacing="7" fill="#E9FFD6">BACK-END DEVELOPER</text>
    <text x="372" y="256" font-size="18" fill="#93C46F">Java · Spring Boot · Python · Flask · Django</text>
    <rect class="blink" x="864" y="241" width="11" height="19" fill="#A6FF1A"/>

    <!-- hud -->
    <circle class="blink" cx="1036" cy="41" r="5" fill="#A6FF1A"/>
    <text x="1160" y="46" font-size="14" letter-spacing="2" fill="#A6FF1A" text-anchor="end">SYS ONLINE</text>
    <g fill="#A6FF1A">
      <rect class="lvl" x="1112" y="196" width="48" height="6" rx="1"/>
      <rect class="lvl l2" x="1112" y="184" width="48" height="6" rx="1"/>
      <rect class="lvl l3" x="1112" y="172" width="48" height="6" rx="1"/>
      <rect class="lvl l4" x="1112" y="160" width="48" height="6" rx="1"/>
      <rect class="lvl l5" x="1112" y="148" width="48" height="6" rx="1"/>
      <rect class="lvl l6" x="1112" y="136" width="48" height="6" rx="1"/>
    </g>
    <text x="1160" y="226" font-size="11" letter-spacing="2" fill="#5E7F4C" text-anchor="end">PWR</text>
    <text x="1160" y="292" font-size="12" letter-spacing="2" fill="#5E7F4C" text-anchor="end">CLEAN CODE // EFFECTIVE JAVA // SOLID</text>

    <rect width="1200" height="320" fill="url(#scan)"/>
  </g>

  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#A6FF1A" stroke-opacity="0.3"/>
  <g fill="none" stroke="#A6FF1A" stroke-width="3">
    <path d="M14 46 V14 H46"/>
    <path d="M1154 14 H1186 V46"/>
    <path d="M14 274 V306 H46"/>
    <path d="M1154 306 H1186 V274"/>
  </g>
</svg>
