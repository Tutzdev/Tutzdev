<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-label="Fim da transmissão">
  <defs>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A6FF1A" stop-opacity="0"/>
      <stop offset="1" stop-color="#A6FF1A" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A6FF1A" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#A6FF1A" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="face"><circle cx="600" cy="42" r="19"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Courier New', Consolas, 'Liberation Mono', monospace; }
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .6; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="120" y="41" width="430" height="2" fill="url(#left)"/>
  <rect x="650" y="41" width="430" height="2" fill="url(#right)"/>
  <circle cx="600" cy="42" r="27" fill="#0D140D" stroke="#4A544A" stroke-width="5"/>
  <circle cx="600" cy="42" r="19" fill="#040704"/>
  <path class="pulse" clip-path="url(#face)" filter="url(#blur)" d="M574 18 H626 L605 42 L626 66 H574 L595 42 Z" fill="#A6FF1A"/>
  <text x="600" y="98" font-size="14" letter-spacing="5" fill="#6F9A57" text-anchor="middle">FIM DA TRANSMISSÃO</text>
</svg>
